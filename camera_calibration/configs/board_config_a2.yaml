# ChArUco board specification for the physical A2 board.
#
# Source of truth for this print: charuco_a2_board_v2/mh5_zed_charuco_a2_board_v1.svg
# (+ manifest.json alongside it). Do NOT hand-edit squares_x/y, square/marker
# length, or dictionary here without re-verifying against that SVG/manifest —
# see configs/a2_board_source/provenance.json for the sha256 + how
# legacy_pattern below was determined (empirically, not guessed).
#
# This file is independent from board_config.yaml (the 5x7 board) — do not
# merge or overwrite either one; both physical boards may be in use.

name: charuco_a2_10x8_45mm

squares_x: 10          # number of chessboard squares, horizontal
squares_y: 8            # number of chessboard squares, vertical
square_length_m: 0.045    # 45 mm (manifest.json: square_length_mm) — METRIC UNCONFIRMED, see provenance.json
marker_length_m: 0.032    # 32 mm (manifest.json: marker_length_mm) — METRIC UNCONFIRMED, see provenance.json

dictionary: DICT_5X5_100

# Determined empirically by extracting the embedded raster <image> from the
# source SVG (4500x3600 px) and pixel-diffing it against boards rendered
# locally with compat.make_charuco_board() for both legacy_pattern values at
# the same 4500x3600 px / border_bits=1 / margin_size=0 settings:
#   legacy_pattern=True  -> 62.0% pixels differ (wrong square arrangement)
#   legacy_pattern=False -> 0.33% pixels differ (anti-aliasing noise only,
#                            252 small blobs, median 92 px vs a full 45mm
#                            square = 202500 px -> no structural mismatch)
# See configs/a2_board_source/provenance.json for full method + numbers.
legacy_pattern: false
