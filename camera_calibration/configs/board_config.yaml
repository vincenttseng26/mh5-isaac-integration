# ChArUco board specification used across board generation, detection and
# hand-eye calibration. Keep this file as the single source of truth —
# every script in camera_calibration/ reads it instead of hard-coding values.
#
# IMPORTANT: square_length_m / marker_length_m must match the *physically
# printed* board exactly. If you reprint at a different scale, update this
# file (or generate a new board_config alongside the new print) before
# running any pose-estimation or hand-eye script — a mismatch silently
# produces wrong metric scale in every downstream pose.

name: charuco_5x7_30mm

squares_x: 5          # number of chessboard squares, horizontal
squares_y: 7           # number of chessboard squares, vertical
square_length_m: 0.03    # 30 mm
marker_length_m: 0.0225  # 22.5 mm (75% of square_length, OpenCV recommendation)

dictionary: DICT_6X6_250

# OpenCV >=4.7 changed the internal black/white square arrangement of
# CharucoBoard vs. the legacy (<=4.6) CharucoBoard_create pattern. Boards
# already printed with the old generate_calibration_boards.py script (in the
# repo root) use the legacy pattern. Keep this True unless you regenerate
# and reprint the board with a new OpenCV version.
legacy_pattern: true
